# CI gates for eshu-collector-sbom-attestation.
#
# Stable job names (org contract; only ci-complete is ever required in a
# ruleset): changes, lint, test, race, shell, image, boundary, govulncheck,
# gosec, actionlint, ci-complete.
#
# Path selection happens once, in the changes job (dorny/paths-filter). A PR
# only pays for lanes its paths can affect; pushes to main, the weekly
# schedule, and manual dispatches run every lane, so the merged tree and the
# security sweep always leave a full record.
#
# Lane bodies are inline in this file rather than calling
# eshu-hq/.github/.github/workflows/go-collector-ci.yml@v1. That reusable
# workflow exists, but v1 has no path-gating inputs for govulncheck/gosec,
# runs govulncheck in default symbol mode (which panics on Go 1.26 SSA),
# lets gosec's Go 1.26 type-error exit fail the lane, and has no
# manifest-digest or actionlint lanes. When a reusable version grows those
# inputs, the move is a thin swap with no job-name churn.
#
# Pinned actions (SHAs resolved 2026-10-28 via git ls-remote; Dependabot
# github-actions proposes bumps, weekly grouped):
#   actions/checkout v6.1.0              d23441a48e516b6c34aea4fa41551a30e30af803
#   actions/setup-go v6.5.0              924ae3a1cded613372ab5595356fb5720e22ba16
#   dorny/paths-filter v4                ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
#   golangci/golangci-lint-action v9.3.0 d583c34f0599d37dbac4a198b9c83201be380893
#   actions/upload-artifact v7.0.2       cf430e030ddbb5b0abf93d22962f4752f3646cd9
#   rhysd/actionlint v1.7.9              a443f344ff32813837fa49f7aa6cbc478d770e62
#   ludeeus/action-shellcheck            00cae500b08a931fb5698e11e79bfbd38e612a38
#   github/codeql-action/upload-sarif v4.39.1 8498dc4c2b27cdd99baf0f87955b29ebbf30c78d
# Go tools (hash-verified by the toolchain on install):
#   golangci-lint v2.12.2 (same binary Eshu uses; config in .golangci.yml)
#   govulncheck v1.9.0, run with -scan package (Go 1.26 SSA-safe)
#   gosec v2.30.0, run with -no-fail; the SARIF finding count is advisory
#   until its false-positive rate here is measured, then blocking

name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "11 6 * * 1" # weekly Monday 06:11 UTC: full record; only govulncheck/gosec can file issues
  workflow_dispatch: # manual runs execute every lane, like a push

permissions:
  contents: read

# Cancel superseded runs per PR (or per ref for pushes and schedules).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Runs on every event on purpose: on push/schedule/dispatch the filter
    # outputs are unused (lane conditions short-circuit on event), but every
    # lane `needs` this job — skipping it drags all lanes to skipped and the
    # run goes vacantly green.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      shell: ${{ steps.filter.outputs.shell }}
      deps: ${{ steps.filter.outputs.deps }}
      image: ${{ steps.filter.outputs.image }}
      workflows: ${{ steps.filter.outputs.workflows }}
      misc: ${{ steps.filter.outputs.misc }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          # Needed so the `misc` catch-all below can use `!` negations;
          # groups without negations behave exactly as before.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
            fixtures:
              # Every entry is grep-proven test- or embed-consumed:
              # testdata/** via document/*_fixture_test.go (readFixture),
              # document/parser_bench_test.go, runtime/source_test.go and
              # runtime/source_parity_8865_test.go (readFixture ../document
              # plus parity8865FixturePath), and cmd/collector/main_test.go;
              # **/*.json via the same fixture readers; manifest.yaml via
              # manifest_test.go (os.ReadFile), manifest.go (go:embed), and
              # cmd/collector/seed_test.go. This repo has no *.example.*
              # files, so none are listed.
              - 'testdata/**'
              - '**/*.json'
              - 'manifest.yaml'
            shell:
              - '**/*.sh'
            deps:
              - 'go.mod'
              - 'go.sum'
            image:
              # manifest.yaml is go:embed'ed into the binary
              # (manifest.go), so a manifest change rebuilds the image.
              - 'Dockerfile'
              - '.dockerignore'
              - 'manifest.yaml'
            workflows:
              - '.github/workflows/**'
            misc:
              # Default required by the epic: anything not classified above
              # runs the full Go lanes. Docs-only must keep skipping, so the
              # docs skip set stays negated here; every classified pattern is
              # negated too so narrow lanes (fixtures/shell/image) keep their
              # shape. Proven by the docs-only / fixture-only skip proofs.
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!CODEOWNERS'
              - '!**/*.go'
              - '!go.mod'
              - '!go.sum'
              - '!.golangci.yml'
              - '!testdata/**'
              - '!**/*.json'
              - '!manifest.yaml'
              - '!**/*.sh'
              - '!Dockerfile'
              - '!.dockerignore'
              - '!.github/workflows/**'
              # .github/dependabot.yml stays unclassified on purpose: a
              # Dependabot-config-only change falls into misc and runs the
              # full Go lanes (fail closed).

  lint:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: lint (whole repo, no baseline)
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2
          args: --timeout 10m
      - name: format check (gofumpt)
        run: golangci-lint fmt --diff ./...
      - name: tidy check
        run: |
          go mod tidy -diff
          git diff --exit-code -- go.mod go.sum
      - name: forbid replace directives
        run: "! grep -E '^replace ' go.mod"
      - name: 500-line file cap (wc -l, sole static gate)
        run: |
          over=0
          for f in $(git ls-files '*.go'); do
            n=$(wc -l < "$f")
            if [ "$n" -gt 500 ]; then echo "$f: $n lines"; over=1; fi
          done
          if [ "$over" -ne 0 ]; then echo "FAIL: .go files over 500 lines"; exit 1; fi
      - name: Diff check
        run: git diff --check

  test:
    needs: [changes]
    # No shell class here: no test executes scripts/pin-digest.sh (verified
    # by grep: no .go file references scripts/), so a shell-only PR never
    # pays for this lane.
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.fixtures == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1

  race:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COVERAGE_FLOOR: "71.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: race + coverprofile
        run: go test ./... -race -count=1 -covermode=atomic -coverprofile=coverage.out
      - name: coverage totals
        run: go tool cover -func=coverage.out >> "$GITHUB_STEP_SUMMARY"
      - name: enforce floor (may only rise; finish line is 90%)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "statement coverage total=${total}% floor=${COVERAGE_FLOOR}%"
          awk -v t="$total" -v f="$COVERAGE_FLOOR" 'BEGIN { if (t + 0 < f + 0) { print "FAIL: coverage below floor"; exit 1 } }'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
          if-no-files-found: error

  shell:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: .
          format: gcc

  image:
    needs: [changes]
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.image == 'true' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build the image without pushing it
        run: docker build -t eshu-collector-sbom-attestation:ci .
      - name: Seed contract
        run: |
          seed="$RUNNER_TEMP/seed"
          mkdir -p "$seed" && chmod 777 "$seed"
          docker run --rm --network none -v "$seed:/component" eshu-collector-sbom-attestation:ci seed --dest /component
          test -x "$seed/collector"
          test -s "$seed/manifest.yaml"
      - name: manifest image is placeholder or digest-pinned (fail loud)
        run: |
          set -euo pipefail
          # manifest.yaml keeps the all-zero placeholder permanently: it is
          # go:embed'ed into the binary, so a committed digest could only
          # describe an older build (manifest_test.go). Anything that is
          # neither the placeholder nor a real digest pin fails loud.
          total=$(grep -Ec '^[[:space:]]*image:' manifest.yaml)
          placeholder=$(grep -Ec '^[[:space:]]*image:[[:space:]]*[^[:space:]#]+@sha256:0{64}[[:space:]]*$' manifest.yaml)
          pinned=$(grep -Ec '^[[:space:]]*image:[[:space:]]*[^[:space:]#]+@sha256:[0-9a-f]{64}[[:space:]]*$' manifest.yaml)
          echo "manifest image refs: $pinned digest-pinned ($placeholder placeholder) of $total"
          [ "$pinned" -eq "$total" ]
          from_total=$(grep -Ec '^[[:space:]]*FROM ' Dockerfile)
          from_pinned=$(grep -Ec '^[[:space:]]*FROM [^[:space:]]+@sha256:[0-9a-f]{64}' Dockerfile)
          echo "Dockerfile bases: $from_pinned/$from_total digest-pinned"
          [ "$from_pinned" -eq "$from_total" ]
          want=$(awk '/^go / {print $2}' go.mod)
          got=$(grep -E -o 'golang:[0-9.]+' Dockerfile | head -1 | cut -d: -f2)
          echo "go.mod $want / Dockerfile golang $got"
          [ "$want" = "$got" ]

  boundary:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test -count=1 -run TestImportBoundaryRejectsCoreAndCrossCollectorImports .

  govulncheck:
    needs: [changes]
    # Go-class changes ride along: a toolchain or dependency bump can land
    # with Go sources, and scanning only go.mod/go.sum diffs would miss it.
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.deps == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # scheduled runs file or update a findings issue
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: govulncheck (package mode is Go 1.26 SSA-safe)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" -scan package ./...
      - name: file or update findings issue (scheduled runs)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[govulncheck] findings $(date -u +%F)"
          body="Scheduled govulncheck failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  gosec:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.go == 'true' || needs.changes.outputs.misc == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # SARIF upload to the Security tab
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: gosec SARIF
        # -no-fail: gosec's bundled type-checker cannot fully load Go 1.26
        # generics and exits non-zero even with zero findings; the finding
        # count below is the gate. Advisory until the false-positive rate
        # here is measured; triage happens in the open, never
        # blanket-excluded. This repo: 1 G301 site triaged per-site
        # (cmd/collector/seed.go:128, world-traversable seed dir is the
        # init-container handoff by design), count 0.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          "$(go env GOPATH)/bin/gosec" -no-fail -fmt=sarif -out=gosec.sarif ./...
      - name: upload SARIF
        # Non-PR events only: fork PRs cannot write code-scanning results,
        # so they skip via the event gate below instead of failing on a
        # 403. No continue-on-error: on push/schedule the token carries
        # security-events:write, so a failure is real and fails loud.
        # The scan step above needs contents:read alone, so PR lanes still
        # run for forks on a read-only token.
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          sarif_file: gosec.sarif
      - name: finding count (advisory on PR; red on scheduled findings)
        run: |
          n=$(jq '[.runs[].results[]] | length' gosec.sarif)
          echo "## gosec findings: $n" >> "$GITHUB_STEP_SUMMARY"
          echo "gosec findings: $n"
          # Findings fail scheduled runs so the `failure()`-gated issue
          # step below is reachable; PR runs stay advisory green.
          if [ "${n:-0}" -gt 0 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "gosec findings on a scheduled run; failing to file the issue."
            exit 1
          fi
      - name: file or update findings issue (scheduled runs)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[gosec] findings $(date -u +%F)"
          body="Scheduled gosec failed on ${{ github.sha }}. See run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          open=$(gh issue list --search "$title in:title" --state open --json number --jq '.[0].number')
          if [ -n "$open" ] && [ "$open" != "null" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  actionlint:
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: rhysd/actionlint@a443f344ff32813837fa49f7aa6cbc478d770e62 # v1.7.9
        # No `with:` block: this action takes no inputs and fails the step
        # whenever actionlint reports an error.

  ci-complete:
    needs: [changes, lint, test, race, shell, image, boundary, govulncheck, gosec, actionlint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: aggregate (pass when needed lanes passed or legitimately skipped)
        run: |
          python3 - <<'EOF'
          import json, os
          # NEEDS_JSON is toJSON(needs): {job: {"result": ..., "outputs": ...}}.
          # Compare v["result"]: comparing whole job OBJECTS never matches
          # (false-green), and needs.*.result is a bare ARRAY that kills
          # green runs. Proven by the seeded red/green lane proofs in the
          # closing PR; never change this shape without re-seeding.
          needs = json.loads(os.environ["NEEDS_JSON"])
          bad = {k: v.get("result") for k, v in needs.items()
                 if isinstance(v, dict) and v.get("result") in ("failure", "cancelled")}
          if bad:
              print("FAIL:", bad)
              raise SystemExit(1)
          print("ci-complete: pass (skips allowed)")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
