name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: true
      - run: test -z "$(gofmt -l .)"
        shell: bash
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./... -count=1
      - run: go test ./runtime/ ./document/ -count=1 -race
      - name: forbid replace directives
        run: "! grep -E '^replace ' go.mod"
        shell: bash

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image without pushing it
        run: docker build -t eshu-collector-sbom-attestation:ci .
      - name: Seed contract
        run: |
          seed="$RUNNER_TEMP/seed"
          mkdir -p "$seed" && chmod 777 "$seed"
          docker run --rm --network none -v "$seed:/component" eshu-collector-sbom-attestation:ci seed --dest /component
          test -x "$seed/collector"
          test -s "$seed/manifest.yaml"
